<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SeuChatSeguro: mensagens privadas com criptografia de ponta a ponta." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatSeguro" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SeuChatSeguro</title>
    <style>
      /* evita o "flash" branco antes do app carregar */
      html, body { background: #0a0a0b; margin: 0; }
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(circle at 50% 30%, #1d1912 0%, #0a0a0b 60%); font-family: Inter, system-ui, sans-serif; color: #efe6cf; transition: opacity .4s ease; }
      #boot-splash.out { opacity: 0; pointer-events: none; }
      #boot-splash img { width: 92px; height: 92px; animation: bs-pulse 1.8s ease-in-out infinite; filter: drop-shadow(0 18px 40px rgba(212,175,95,.25)); }
      #boot-splash p { margin: 0; font-size: 20px; letter-spacing: -.02em; font-weight: 600; }
      #boot-splash p b { color: #d4af5f; }
      #boot-splash i { display: block; width: 140px; height: 2px; border-radius: 2px; background: rgba(212,175,95,.15); overflow: hidden; position: relative; }
      #boot-splash i::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, #e9cf8a, transparent); animation: bs-run 1.2s ease-in-out infinite; }
      @keyframes bs-pulse { 50% { transform: scale(.94); opacity: .85; } }
      @keyframes bs-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"><img src="/favicon.svg" alt="" /><p>SeuChat<b>Seguro</b></p><i></i></div>
    <div id="root"></div>
    <noscript>Ative o JavaScript para usar o SeuChatSeguro.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
