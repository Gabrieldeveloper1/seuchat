<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SeuChatSeguro: mensagens privadas com criptografia de ponta a ponta." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatSeguro" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark-blue-27.svg" />
    <link rel="apple-touch-icon" href="/icon-blue-27-180.png" />
    <link rel="manifest" href="/manifest-blue-27.webmanifest" />
    <title>SeuChatSeguro</title>
    <style>
      /* evita o "flash" branco antes do app carregar */
      html, body { background: #101010; margin: 0; }
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(circle at 50% 30%, #17233b 0%, #101010 60%); font-family: Inter, Arial, sans-serif; color: #f4f5f7; transition: opacity .4s ease; }
      #boot-splash.out { opacity: 0; pointer-events: none; }
      #boot-splash img { width: 92px; height: 92px; animation: bs-pulse 1.8s ease-in-out infinite; filter: drop-shadow(0 18px 40px rgba(36,87,214,.16)); }
      #boot-splash p { margin: 0; font-size: 20px; letter-spacing: -.02em; font-weight: 600; }
      #boot-splash p b { color: #8eafff; }
      #boot-splash i { display: block; width: 140px; height: 2px; border-radius: 2px; background: rgba(36,87,214,.18); overflow: hidden; position: relative; }
      #boot-splash i::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, #8eafff, transparent); animation: bs-run 1.2s ease-in-out infinite; }
      @keyframes bs-pulse { 50% { transform: scale(.94); opacity: .85; } }
      @keyframes bs-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"><img src="/brand-mark-blue-27.svg" alt="" /><p>SeuChat<b>Seguro</b></p><i></i></div>
    <div id="root"></div>
    <noscript>Ative o JavaScript para usar o SeuChatSeguro.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
